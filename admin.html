<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Hussain Bapu's Wellness</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="container">

<h1>🕌 Hussain Bapu's Wellness</h1>

<h2>Admin Dashboard</h2>

</div>

</header>

<section>

<div class="container">

<div class="card">

<h2>📊 Dashboard</h2>

<p>Total Patients :
<span id="totalPatients">0</span></p>

<p>Pending Appointments :
<span id="pendingAppointments">0</span></p>

</div>

<div class="card">

<h2>🔍 Search Patient</h2>

<input
type="text"
id="searchBox"
placeholder="Search Name / Mobile / Appointment ID">

</div>

<div class="card">

<h2>📅 Appointment List</h2>

<table
id="patientsTable"
border="1"
width="100%">

<thead>

<tr>

<th>Appointment ID</th>

<th>Full Name</th>

<th>Mobile</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="admin.js"></script>

</body>

</html>
