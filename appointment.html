<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<body>

<header>

<div class="container">

<div class="hero">

<h1>📅 Book Your Consultation</h1>

<p class="sub">

Thank you for choosing
<b>Hussain Bapu's Wellness</b>.

Please complete the form below.

After reviewing your request,

our team will personally confirm your appointment.

</p>

</div>

</div>

</header>

<section>

<div class="container">

<div class="card">

<h2 class="section-title">

Consultation Request Form

</h2>

<form id="appointmentForm">

<label>👤 Full Name *</label>
<input type="text" required>

<label>📱 Mobile Number *</label>
<input type="tel" required>

<label>💬 WhatsApp Number *</label>
<input type="tel" required>

<label>🎂 Age *</label>
<input type="number" min="1" max="120" required>

<label>⚧ Gender *</label>

<select required>

<option value="">Select</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<label>🌍 Country *</label>

<input type="text" required>

<label>🏙 State *</label>

<input type="text" required>

<label>📍 City *</label>

<input type="text" required>

<label>🕌 Consultation Type *</label>

<select required>

<option value="">Select</option>

<option>🌍 Online Video Consultation</option>

<option>🕌 Physical Darbar Visit</option>

</select>

<label>📂 Problem Category *</label>

<select required>

<option value="">Select Category</option>

<option>🔮 Spiritual / Ruhani Problems</option>

<option>👻 Paranormal (Jinn / Aseb / Evil Effects)</option>

<option>🏡 Home & Family Problems</option>

<option>💑 Marriage & Relationship</option>

<option>💼 Business & Career</option>

<option>💰 Financial Problems</option>

<option>🧿 Nazar / Negative Energy</option>

<option>🌿 Herbal Wellness Guidance</option>

<option>🙏 Personal Guidance</option>

<option>📌 Other</option>

</select>

<label>📝 Brief Description *</label>

<textarea rows="6" required></textarea>

<br><br>

<button class="btn gold" type="submit">

📅 Submit Consultation Request

</button>

</form>

</div>

</div>

</section>

</html>
